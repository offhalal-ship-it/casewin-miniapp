<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CaseWin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Базовые настройки и цвета CS2 */
  :root {
    --bg: #0a0a0f;
    --card-bg: #14141e;
    --orange: #ff6b00;
    --cyan: #00f0ff;
    --text: #ffffff;
    --text-muted: #888899;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  
  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    background-image: radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.15) 0%, transparent 50%);
  }

  /* Шапка профиля */
  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: rgba(20, 20, 30, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, var(--orange), #ff0044); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; }
  .username { font-weight: 600; font-size: 16px; }
  
  .balance {
    background: #14141e;
    padding: 8px 15px;
    border-radius: 20px;
    border: 1px solid rgba(0, 240, 255, 0.3);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: bold;
    color: var(--cyan);
  }
  .balance span { color: var(--text); font-size: 14px;}

  /* Главный экран */
  .main-content {
    width: 100%;
    max-width: 500px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
  }

  /* Карточка кейса */
  .case-card {
    width: 100%;
    background: linear-gradient(145deg, #181824, #0d0d14);
    border-radius: 24px;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }

  /* Свечение за кейсом */
  .case-card::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 200px;
    background: var(--orange);
    filter: blur(80px);
    opacity: 0.3;
    z-index: 0;
  }

  .case-image-container {
    width: 200px;
    height: 200px;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    transition: transform 0.3s ease;
  }

  .case-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
  }

  .case-title {
    margin-top: 20px;
    font-size: 24px;
    font-weight: 800;
    z-index: 1;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .case-price {
    margin-top: 5px;
    color: var(--text-muted);
    font-size: 14px;
    z-index: 1;
  }

  /* Кнопка открытия */
  .open-btn {
    margin-top: 30px;
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(90deg, #ff0044, var(--orange));
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(255, 107, 0, 0.3);
    transition: all 0.2s ease;
    z-index: 1;
  }

  .open-btn:active {
    transform: scale(0.96);
    box-shadow: 0 5px 10px rgba(255, 107, 0, 0.2);
  }

  .open-btn:disabled {
    background: #333;
    color: #666;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  /* Анимация выигрыша */
  .win-message {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(20, 20, 30, 0.95);
    border: 2px solid var(--cyan);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.3);
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .win-message.show { transform: translate(-50%, -50%) scale(1); }
  .win-item { font-size: 40px; margin-bottom: 10px; }
  .win-text { font-weight: bold; color: var(--cyan); font-size: 20px; }

</style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="user-info">
      <div class="avatar" id="userAvatar">U</div>
      <div class="username" id="userName">Loading...</div>
    </div>
    <div class="balance">
      ⭐️ <span>0.00</span>
    </div>
  </div>

  <!-- Основной контент -->
  <div class="main-content">
    
    <div class="case-card">
      <div class="case-image-container" id="caseContainer">
        <!-- Сюда вставим картинку -->
        <img src="https://i.ibb.co/6PXN1sV/case.png" alt="Case" class="case-image" id="caseImg">
      </div>
      <div class="case-title">Plush Pepe Case</div>
      <div class="case-price">Стоимость: 100 ⭐️</div>
      
      <button class="open-btn" id="openBtn" onclick="openCase()">Открыть кейс</button>
    </div>

  </div>

  <!-- Всплывающее окно выигрыша -->
  <div class="win-message" id="winMessage">
    <div class="win-item" id="winItem">🐸</div>
    <div class="win-text">Поздравляем!</div>
    <p style="color:#888; margin-top:5px; font-size:14px;">Вы выиграли <span id="winName">Plush Pepe</span></div>
  </div>

  <script>
    // 1. Инициализация Telegram Web App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Разворачиваем на весь экран
      
      // Получаем данные пользователя
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('userName').innerText = user.first_name;
        if (user.first_name) {
            document.getElementById('userAvatar').innerText = user.first_name[0].toUpperCase();
        }
      }
    }

    // 2. Логика открытия кейса (пока локальная)
    let isOpening = false;

    function openCase() {
      if (isOpening) return;
      isOpening = true;
      
      const btn = document.getElementById('openBtn');
      const caseImg = document.getElementById('caseImg');
      const winMessage = document.getElementById('winMessage');
      
      btn.innerText = "Открываем...";
      btn.disabled = true;
      
      // Анимация тряски кейса
      let shakeCount = 0;
      const shakeInterval = setInterval(() => {
        caseImg.style.transform = `translate(${Math.random() * 10 - 5}px, ${Math.random() * 10 - 5}px) rotate(${Math.random() * 10 - 5}deg)`;
        shakeCount++;
        
        if (shakeCount > 15) {
          clearInterval(shakeInterval);
          caseImg.style.transform = 'scale(1)';
          
          // Выдаем рандомный приз
          const prizes = [
            { emoji: '🐸', name: 'Plush Pepe' },
            { emoji: '🎁', name: 'Telegram Gift' },
            { emoji: '🔪', name: 'Karambit Knife' },
            { emoji: '🔫', name: 'AK-47' }
          ];
          const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
          
          // Показываем окно
          document.getElementById('winItem').innerText = randomPrize.emoji;
          document.getElementById('winName').innerText = randomPrize.name;
          winMessage.classList.add('show');
          
          // Возвращаем кнопку
          btn.innerText = "Открыть еще раз";
          btn.disabled = false;
          isOpening = false;
          
          // Скрываем окно через 3 секунды
          setTimeout(() => {
            winMessage.classList.remove('show');
          }, 3000);
        }
      }, 50);
    }
  </script>
</body>
  </html>
